name: CI

on:
  push:
    # Runs when commits land directly on main.
    branches: [main]
    # Skip CI for markdown-only changes.
    paths-ignore:
      - "**/*.md"
  pull_request:
    # No branches filter, so every PR runs CI.
    # Skip CI for markdown-only changes.
    paths-ignore:
      - "**/*.md"

# Grants the workflow token read-only access to repo contents,
# enough for checkout.
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      # Pull the repo onto the runner.
      - name: Checkout code
        uses: actions/checkout@v4

      # Pin the Node major version and cache npm downloads keyed on the lockfile.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # Installs dependencies exactly as pinned in package-lock.json.
      - name: Install dependencies
        run: npm ci

      # Catch type errors.
      - name: Run typecheck
        run: npm run typecheck

      # Fail if anything is unformatted (does not rewrite files).
      - name: Check formatting with Prettier
        run: npm run prettier

      # Fail on any rule violation.
      - name: Run linter
        run: npm run lint

      # Run the test suite.
      - name: Run tests
        run: npm run test

      # Compiles src/ to dist/ here as a sanity check that the build succeeds.
      - name: Run build
        run: npm run build
